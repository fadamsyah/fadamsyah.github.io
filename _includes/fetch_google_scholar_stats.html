<script>
    window.renderScholarStats = function (data) {
        var total = document.getElementById('total_cit');
        if (total && data['citedby'] !== undefined) {
            total.innerHTML = data['citedby'];
            var box = document.getElementById('gs-cites');
            if (box) { box.hidden = false; }
        }
        var citationEles = document.getElementsByClassName('show_paper_citations');
        Array.prototype.forEach.call(citationEles, function (element) {
            var pub = (data['publications'] || {})[element.getAttribute('data')];
            if (pub) { element.innerHTML = '| Citations: ' + pub['num_citations']; }
        });
    };
    $(document).ready(function () {
        {% if site.google_scholar_stats_use_cdn %}
        var gsDataBaseUrl = 'https://cdn.jsdelivr.net/gh/{{ site.repository }}@';
        {% else %}
        var gsDataBaseUrl = 'https://raw.githubusercontent.com/{{ site.repository }}/';
        {% endif %}
        $.getJSON(gsDataBaseUrl + "google-scholar-stats/gs_data.json", window.renderScholarStats);
    });
</script>
