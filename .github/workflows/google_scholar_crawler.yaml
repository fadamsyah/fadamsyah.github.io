name: Get Citation Data

on:
  page_build:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: '3.14'
    - name: Run
      run: |
        cd ./google_scholar_crawler
        pip install -r requirements.txt
        python main.py
        if [ ! -f results/gs_data.json ]; then
          echo "No new citation data; the google-scholar-stats branch is left unchanged."
          exit 0
        fi
        cd ./results
        git init
        git config --local user.name "${GITHUB_ACTOR}"
        git config --local user.email "${GITHUB_ACTOR}@users.noreply.github.com"
        export remote_repo="https://${GITHUB_ACTOR}:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git"
        git add *.json
        git commit -m "Updated Citation Data"
        git push "${remote_repo}" HEAD:google-scholar-stats --force
      env:
        # Public Google Scholar profile ID (the value after "user=" in the profile URL).
        GOOGLE_SCHOLAR_ID: W-4975wAAAAJ
